name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        working-directory: windows
        run: dotnet restore MiddleFlow.Windows.sln
      - name: Build
        working-directory: windows
        run: dotnet build MiddleFlow.Windows.sln -c Release --no-restore -p:EnableWindowsTargeting=true
      - name: Core smoke tests
        working-directory: windows
        run: dotnet run --project tests/MiddleFlow.Core.Tests/MiddleFlow.Core.Tests.csproj -c Release --no-build -p:EnableWindowsTargeting=true
      - name: Win32 input layout test
        working-directory: windows
        run: dotnet run --project tests/MiddleFlow.Windows.Tests/MiddleFlow.Windows.Tests.csproj -c Release --no-build -p:EnableWindowsTargeting=true
      - name: Publish ${{ matrix.runtime }}
        shell: pwsh
        working-directory: windows
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} -Configuration Release -Version "${{ github.ref_name }}"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MiddleFlow-windows-${{ matrix.runtime }}
          path: windows/dist/MiddleFlow-*-${{ matrix.runtime }}.zip
          if-no-files-found: error

  release:
    needs: windows
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: MiddleFlow-windows-*
          path: dist
          merge-multiple: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select signing mode
        id: signing_mode
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [[ -n "$DEVELOPER_ID_P12_BASE64" ]]; then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          else
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        run: swift test
      - name: Build preview app
        run: ./scripts/build_app.sh
      - name: Import signing identity
        if: steps.signing_mode.outputs.mode == 'notarized'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/developer-id.p12" -k build.keychain \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/developer-id.p12"
      - name: Sign and notarize
        if: steps.signing_mode.outputs.mode == 'notarized'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          KEYCHAIN_PROFILE: MiddleFlowRelease
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID"
          MIDDLEFLOW_SIGN_IDENTITY="$IDENTITY" ./scripts/build_app.sh
          ditto -c -k --keepParent build/MiddleFlow.app build/MiddleFlow.zip
          xcrun notarytool submit build/MiddleFlow.zip --keychain-profile "$KEYCHAIN_PROFILE" --wait
          xcrun stapler staple build/MiddleFlow.app
          xcrun stapler validate build/MiddleFlow.app
          spctl --assess --type execute --verbose=4 build/MiddleFlow.app
      - name: Package
        run: PACKAGE_SKIP_BUILD=1 ./scripts/package_release.sh "${GITHUB_REF_NAME#v}"
      - name: Sign and notarize DMG
        if: steps.signing_mode.outputs.mode == 'notarized'
        env:
          KEYCHAIN_PROFILE: MiddleFlowRelease
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          DMG="dist/MiddleFlow-${GITHUB_REF_NAME#v}-macOS-universal.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --keychain-profile "$KEYCHAIN_PROFILE" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: MiddleFlow ${{ github.ref_name }}
          prerelease: ${{ steps.signing_mode.outputs.mode == 'preview' }}
          body: |
            ## 2.0.1

            - 增加豆包输入法安装、注册和当前输入源检测，并提供完整安装指引。
            - 修复 UU Remote 双击中键发送 Return：先恢复远控窗口焦点，再发送回车。
            - UU Remote 双击不再闪现语音悬浮窗，使用 320 ms 响应窗口区分单击和双击。
            - 提升豆包稳定文本识别和自动粘贴速度，完善设置顶栏和双语文档。
            - 提供 macOS Universal、Windows x64 和 Windows ARM64 预览包。

            macOS 预览包未使用 Developer ID 签名或 Apple notarization，首次打开可能需要右键选择“打开”。Windows 预览包尚未做 Authenticode 签名。

            ## English

            - Added Doubao input-method installation, registration, current-source, and version detection with setup guidance.
            - Fixed UU Remote double-click Return by restoring remote-window focus before sending Enter.
            - Removed the voice-composer flash on UU Remote double-click and added a responsive 320 ms gesture window.
            - Improved transcript stabilization and auto-paste latency, the settings top bar, and bilingual documentation.
            - Includes macOS Universal, Windows x64, and Windows ARM64 preview packages.

            The macOS preview is not Developer ID signed or notarized and may require right-click Open. The Windows preview is not Authenticode signed.
