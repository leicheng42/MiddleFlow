name: MiddleFlow
options:
  bundleIdPrefix: io.github.leicheng42
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  MiddleFlow:
    type: application
    platform: macOS
    sources:
      - path: Sources/MiddleFlow
      - path: Resources/MiddleFlow.icns
    entitlements:
      path: Resources/MiddleFlow.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leicheng42.middleflow
        PRODUCT_NAME: MiddleFlow
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: true
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: CoreAudio.framework
      - sdk: ServiceManagement.framework
