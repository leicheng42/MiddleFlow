name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run unit tests
        run: swift test
      - name: Build universal app
        run: ./scripts/build_app.sh
      - name: Inspect architectures
        run: lipo -info build/MiddleFlow.app/Contents/MacOS/MiddleFlow
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: MiddleFlow-unsigned
          path: build/MiddleFlow.app
