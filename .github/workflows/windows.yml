name: Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: windows
        run: dotnet restore MiddleFlow.Windows.sln

      - name: Build
        working-directory: windows
        run: dotnet build MiddleFlow.Windows.sln -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Core smoke tests
        working-directory: windows
        run: dotnet run --project tests/MiddleFlow.Core.Tests/MiddleFlow.Core.Tests.csproj -c Release --no-build -p:EnableWindowsTargeting=true

      - name: Win32 input layout test
        working-directory: windows
        run: dotnet run --project tests/MiddleFlow.Windows.Tests/MiddleFlow.Windows.Tests.csproj -c Release --no-build -p:EnableWindowsTargeting=true

      - name: Publish ${{ matrix.runtime }}
        shell: pwsh
        working-directory: windows
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} -Configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiddleFlow-${{ matrix.runtime }}
          path: windows/dist/${{ matrix.runtime }}
          if-no-files-found: error
